<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEAC · Panel</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="marca">
      <span class="logo-pequeno" aria-hidden="true">🎓</span>
      <span>JEAC Evaluaciones</span>
    </div>
    <div class="sesion">
      <div>
        <strong id="nombreUsuario"></strong>
        <span class="rol" id="rolUsuario"></span>
      </div>
      <button type="button" id="botonSalir">Cerrar sesión</button>
    </div>
  </header>

  <nav class="menu" id="menu" hidden></nav>

  <main id="contenido">
    <p class="vacio">Cargando…</p>
  </main>

  <dialog id="modal"></dialog>
  <div id="aviso" class="aviso" role="status"></div>

  <script src="js/api.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
