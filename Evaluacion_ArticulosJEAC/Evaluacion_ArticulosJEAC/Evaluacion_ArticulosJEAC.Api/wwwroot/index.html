<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEAC · Evaluación de artículos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="fondo-login">
  <main class="tarjeta-login">
    <div class="logo" aria-hidden="true">🎓</div>
    <h1>JEAC Evaluaciones</h1>
    <p class="subtitulo">Plataforma de Evaluación de Artículos Científicos</p>

    <form id="formLogin" novalidate>
      <label for="usuario">Usuario</label>
      <div class="campo-icono">
        <span aria-hidden="true">👤</span>
        <input id="usuario" type="text" placeholder="admin ó user" autocomplete="username" required>
      </div>

      <label for="contrasena">Contraseña</label>
      <div class="campo-icono">
        <span aria-hidden="true">🔒</span>
        <input id="contrasena" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <p id="errorLogin" class="error" role="alert" hidden></p>

      <button type="submit" id="botonLogin">Iniciar Sesión →</button>
    </form>

    <p class="credenciales">
      Credenciales de prueba:<br>
      <strong>admin / admin123 • user / user123</strong>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
