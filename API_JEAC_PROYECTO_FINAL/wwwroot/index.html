<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEAC · Cronograma de exposiciones</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Pantalla de ingreso -->
  <main id="vista-login" class="login">
    <section class="login-marca" aria-hidden="true">
      <h1>JORNADA DE EXPOSICION DE ARTICULOS CIENTIFICOS</h1>
    </section>

    <form id="form-login" class="login-form" autocomplete="on">
      <h2>Ingresar</h2>
      <label>Usuario
        <input id="usuario" name="usuario" autocomplete="username" required autofocus>
      </label>
      <label>Contraseña
        <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="btn primario" id="login-btn">Entrar</button>

      <div class="demo">
        <p>Cuentas de prueba (contraseña 1234)</p>
        <div>
          <button type="button" data-u="administrador">administrador</button>
          <button type="button" data-u="docente1">docente1</button>
          <button type="button" data-u="estudiante1">estudiante1</button>
        </div>
      </div>
    </form>
  </main>

  <!-- Aplicación (después de ingresar) -->
  <div id="vista-app" hidden>
    <header class="top">
      <strong class="marca">JEAC</strong>
      <span id="top-rol" class="rol"></span>
      <span id="top-nombre" class="nombre"></span>
      <button class="btn" id="btn-salir">Salir</button>
    </header>
    <main id="contenido"></main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
